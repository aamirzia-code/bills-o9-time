<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting… · Bills O9 Time</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #000; color: #f2f2f4; font: 16px -apple-system, system-ui, sans-serif; }
  </style>
</head>
<body>
  <p>Connecting your storage…</p>
  <script>
    // Hands the sign-in result back to the app, then returns to it.
    // Google returns values in the #fragment, Dropbox in the ?query.
    (function () {
      var out = {};
      function read(str) {
        str.replace(/^[?#]/, '').split('&').forEach(function (p) {
          if (!p) return;
          var i = p.indexOf('=');
          var k = decodeURIComponent(i < 0 ? p : p.slice(0, i));
          out[k] = i < 0 ? '' : decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
        });
      }
      read(location.search);
      read(location.hash);
      try { localStorage.setItem('b9_oauth', JSON.stringify(out)); } catch (e) {}
      location.replace('./');
    })();
  </script>
</body>
</html>
